<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Random Repository</title>
    <script src="https://kit.fontawesome.com/b798dbba86.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Github Repository Finder</h1>
        <select name="language" id="language">
            <option value="">Select a language</option>
        </select>
        <div class="state">
            <div class="inactive">Please select a language to find a random repository on Github.</div>
            <button class="retry">Click to retry</button>
        </div>
        <div class="repository">
            <div class="content"></div>
            <button class="refresh">Refresh</button>
        </div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
